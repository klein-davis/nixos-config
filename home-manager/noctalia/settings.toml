[shell]
font_family = "JetBrainsMono NF"
polkit_agent = true
telemetry_enabled = true

    [shell.launcher]
    pinned = [ "lm-studio" ]

    [shell.panel]
    control_center_placement = "floating"
    launcher_session_search = true
    transparency_mode = "soft"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    enabled = false
    variant = "default"

[theme]
builtin = "Noctalia"
community_palette = "Horizon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper.default]
path = "/home/nixuser/Pictures/wallpapers/shaded_landscape.jpg"

[wallpaper.last]
path = "/home/nixuser/Pictures/wallpapers/shaded_landscape.jpg"

[wallpaper.monitors.DP-1]
path = "/home/nixuser/Pictures/wallpapers/shaded_landscape.jpg"

[wallpaper.monitors.DP-2]
path = "/home/nixuser/Pictures/wallpapers/shaded_landscape.jpg"

[wallpaper.monitors.DP-3]
path = "/home/nixuser/Pictures/wallpapers/shaded_landscape.jpg"

[weather]
unit = "imperial"

[widget.audio_visualizer]
capsule = true
capsule_radius = 11
color_2 = "on_tertiary"
scale = 1.1500000000000001

[widget.clock]
capsule = true
format = "{:%-I:%M %p}"

[widget.network]
show_label = false

[widget.tray]
drawer = true
drawer_item_size = 22.0

[widget.workspaces]
capsule = true
pill_scale = 0.95000000000000007