config_version = 15

[audio]
enable_overdrive = false
enable_sounds = true

[bar.default]
background_opacity = 0.9499999787658453
center = [ "clock", "audio_visualizer" ]
end = [
    "cpu",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_edge = 10
margin_ends = 60
scale = 1.1000000089406967
start = [ "launcher", "wallpaper", "workspaces" ]
thickness = 38

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"

[brightness]
enable_ddcutil = true

[calendar]

[control_center.calendar]
show_events_card = false

[dock]
auto_hide = true
enabled = true
icon_size = 40
launcher_position = "start"
reserve_space = false
show_dots = true

[location]
address = "Winnie, Texas"

[lockscreen]
transition = [ "honeycomb" ]
transition_duration = 500

